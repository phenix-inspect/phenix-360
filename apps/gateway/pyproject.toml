[project]
name = "phenix360-gateway"
version = "0.0.0"
description = "PHÉNIX 360 — passerelle IA (FastAPI). PoC Sprint 0."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
