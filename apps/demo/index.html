<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy — durcissement anti-XSS, appliqué sur LES DEUX
      hébergeurs (Vercel + GitHub Pages, qui ne peut pas poser d'en-têtes). L'app
      est 100 % locale : aucun `connect-src` externe. Directives :
        • script-src 'self'  : aucun script inline (le build Vite n'en produit pas) ;
        • style-src 'unsafe-inline' : styles inline React + documents HTML générés ;
        • worker-src blob:   : worker pdf.js ; img-src data:/blob: : aperçus/photos.
      (`frame-ancestors`/HSTS ne sont pris en compte qu'en EN-TÊTE → cf. vercel.json.)
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; connect-src 'self' blob: data: https://*.supabase.co wss://*.supabase.co; manifest-src 'self'"
    />
    <meta name="theme-color" content="#131009" />
    <meta name="description" content="Le suivi intelligent de votre projet" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>PHÉNIX 360 — Démo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
