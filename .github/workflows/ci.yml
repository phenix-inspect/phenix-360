name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Format · Lint · Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  database:
    name: Migrations · RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Stubs + migrations + seed + test RLS
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash supabase/test/run.sh

  gateway:
    name: Gateway · Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Aucune MISTRAL_API_KEY : le fournisseur reste en mock (pas d'appel réseau IA).
      - name: Install & test
        working-directory: apps/gateway
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest
